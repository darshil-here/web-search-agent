<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Research Assistant</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%238e929c'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='1.8'/%3E%3Cpath d='M8 16h16M16 8c-4 4-4 12 0 16M16 8c4 4 4 12 0 16' fill='none' stroke='white' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <div id="device">
    <div id="screen">
      <div class="statusbar" aria-hidden="true">
        <span class="clock" id="clock">9:41</span>
        <span></span>
        <span class="status-icons">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.4c2.3 0 4.4.9 6 2.4l1.1-1.1A10.1 10.1 0 0 0 8.5.8 10.1 10.1 0 0 0 1.4 3.7l1.1 1.1a8.5 8.5 0 0 1 6-2.4Zm0 3.4c1.4 0 2.7.5 3.7 1.4l1.1-1.1a7.4 7.4 0 0 0-9.6 0l1.1 1.1c1-.9 2.3-1.4 3.7-1.4Zm0 3.3c-.7 0-1.3.3-1.8.7l1.8 1.9 1.8-1.9c-.5-.4-1.1-.7-1.8-.7Z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2Z" fill="currentColor" opacity=".45"/></svg>
        </span>
      </div>

      <header class="header">
        <div class="avatar" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3.2 3.2-3.2 14.8 0 18M12 3c3.2 3.2 3.2 14.8 0 18"/></svg>
        </div>
        <h1 class="name">Research Assistant
          <svg width="5" height="8" viewBox="0 0 5 8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1 1 3 3-3 3"/></svg>
        </h1>
      </header>

      <main class="thread-wrap">
        <div id="thread" role="log" aria-live="polite" aria-label="Conversation"></div>
        <p id="empty" hidden>Ask me anything. I search the web and cite sources.</p>
      </main>

      <form class="composer" id="composer" autocomplete="off">
        <button type="button" class="plus" disabled aria-label="Attachments" title="Attachments aren't supported">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 2.5v11M2.5 8h11"/></svg>
        </button>
        <div class="field">
          <textarea id="input" rows="1" placeholder="Message" aria-label="Message" enterkeyhint="send"></textarea>
          <button type="button" id="action" class="action" data-mode="off" aria-label="Send" aria-hidden="true" tabindex="-1">
            <svg class="icon-send" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13.5V2.8M3.2 7.4 8 2.6l4.8 4.8"/></svg>
            <svg class="icon-stop" width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="1" y="1" width="10" height="10" rx="2.6"/></svg>
          </button>
        </div>
      </form>

      <div class="home-indicator" aria-hidden="true"></div>
    </div>
    <img id="frame" src="/assets/iphone.png" alt="" draggable="false">
  </div>
</body>
</html>
